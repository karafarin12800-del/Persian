name: PersiaWar2D Android CI

on:
  push:
    branches: [main, feature/2.5d-character-background, feature/2.5d-kenney-environment-clean-sprite, feature/2.5d-city-master, feature/2.5d-professional-map]
  workflow_dispatch:

concurrency:
  group: persiawar2d-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Gradle Wrapper is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar || ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew
      - name: Verify Gradle Wrapper
        run: ./gradlew --version
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK and world assets
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/kenney_isometric-buildings.zip'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/kenney_isometric-landscape.zip'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/isometric-plant-pack.zip'
          echo "PersiaWar2D professional 2.5D world build and asset verification passed."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersiaWar2D-professional-map-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
