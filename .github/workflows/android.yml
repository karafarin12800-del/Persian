name: PersiaWar2D Android CI

on:
  push:
    branches: [main, unity-2.5d]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Do not cancel a valid APK build because another commit was pushed.
# Every build is tied to its exact commit SHA and artifact name.
concurrency:
  group: persiawar2d-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Gradle Wrapper is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar || ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Commit Gradle Wrapper if it was generated
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -E '(^| )gradlew(\.bat)?$|gradle/wrapper/' >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            git commit -m "build: add Gradle Wrapper [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.persiawar2d.v110' versionCode='112' versionName='11.2'"
          echo "PersiaWar2D APK verification passed for v11.2."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersiaWar2D-debug-v11.2-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
