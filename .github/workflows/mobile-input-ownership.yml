name: Mobile Input Ownership
on:
  pull_request:
    paths:
      - 'UnityProject/Assets/Scripts/**'
      - 'UnityProject/Assets/Scenes/**'
      - '.github/workflows/mobile-input-ownership.yml'
  workflow_dispatch:
jobs:
  validate-input-ownership:
    name: Validate single mobile input owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check active scene and single-owner input architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("UnityProject/Assets")
          scripts = root / "Scripts"
          hub_path = scripts / "Input/MobileInputHub.cs"
          flow_path = scripts / "Core/PrototypeFlow.cs"
          scene_path = root / "Scenes/PersiaWarPrototype.unity"
          hub_meta_path = Path(str(hub_path) + ".meta")

          # Remove the unreferenced legacy input/menu/UI owners. Their equivalents
          # are already implemented by MobileInputHub and PrototypeFlow.
          obsolete = [
              "Scripts/Input/MobileMoveInput.cs",
              "Scripts/Input/MobileMoveInput.cs.meta",
              "Scripts/Input/MobileMovementJoystick.cs",
              "Scripts/Input/MobileMovementJoystick.cs.meta",
              "Scripts/UI/PrototypeMatchFlow.cs",
              "Scripts/UI/PrototypeMatchFlow.cs.meta",
              "Scripts/UI/PrototypeMatchFlowBootstrap.cs",
              "Scripts/UI/PrototypeMatchFlowBootstrap.cs.meta",
              "Scripts/UI/AndroidMinimapOverlay.cs",
              "Scripts/UI/AndroidMinimapOverlay.cs.meta",
              "Scripts/UI/CombatHUD.cs",
              "Scripts/UI/CombatHUD.cs.meta",
              "Scripts/UI/GamePauseController.cs",
              "Scripts/UI/GamePauseController.cs.meta",
          ]
          for relative in obsolete:
              assert not (root / relative).exists(), f"Obsolete duplicate component remains: {relative}"

          hub = hub_path.read_text(encoding="utf-8")
          flow = flow_path.read_text(encoding="utf-8")
          scene = scene_path.read_text(encoding="utf-8")
          guid_match = re.search(r"^guid: ([0-9a-f]+)$", hub_meta_path.read_text(encoding="utf-8"), re.M)
          assert guid_match, "MobileInputHub meta GUID is missing"
          hub_guid = guid_match.group(1)
          assert scene.count("guid: " + hub_guid) == 1, "The active scene must serialize exactly one MobileInputHub"
          mobile_input_block = scene[scene.index("guid: " + hub_guid) - 400:scene.index("guid: " + hub_guid) + 300]
          assert "m_Name: MobileInput" in scene, "Expected MobileInput root is missing"
          assert "m_Enabled: 1" in mobile_input_block, "MobileInputHub must be enabled in the scene"
          assert "player: {fileID: 300000}" in scene and "gameplayCamera: {fileID: 200000}" in scene, "MobileInputHub must reference the Player and gameplay camera"

          # Exactly one gameplay script may write movement from an external input source.
          movement_writers = []
          touch_readers = []
          for path in sorted(scripts.rglob("*.cs")):
              source = path.read_text(encoding="utf-8")
              if "player.SetMoveInput(" in source:
                  movement_writers.append(path.relative_to(scripts).as_posix())
              if "Input.GetTouch(" in source or "Input.touchCount" in source:
                  touch_readers.append(path.relative_to(scripts).as_posix())
          assert movement_writers == ["Input/MobileInputHub.cs"], f"Movement has competing writers: {movement_writers}"
          assert touch_readers == ["Core/PrototypeFlow.cs", "Input/MobileInputHub.cs"], f"Unexpected touch owners remain: {touch_readers}"

          # Lifecycle interruption may not leave a stuck movement/fire pointer.
          for callback in (
              "private void OnDisable()",
              "private void OnApplicationPause(bool paused)",
              "private void OnApplicationFocus(bool hasFocus)",
              "ResetAllPointers();",
          ):
              assert callback in hub, f"Missing input reset lifecycle path: {callback}"
          assert "TryGetTouch(movePointerId" in hub and "TryGetTouch(firePointerId" in hub, "Movement and fire must keep separate finger IDs"
          assert "else if (Input.touchCount > 0)" in hub and "while any contact is still down" in hub, "Movement must remain active if Android temporarily omits the captured finger while another contact remains"
          assert "player.SetMoveInput(ToWorldMove(ApplyDeadZone(moveValue)));" in hub, "Movement continuity fallback must preserve the last joystick vector"
          assert "if (!Input.multiTouchEnabled)" in hub and "Input.multiTouchEnabled = true;" in hub, "Android multi-touch must be enforced during active touch dispatch"
          player_controller = (scripts / "Player/PlayerController.cs").read_text(encoding="utf-8")
          assert "if (!WouldCollide(next))" in player_controller and "WouldCollide(slideX)" in player_controller, "Player movement must respect solid obstacles and allow wall sliding"
          bootstrap = (scripts / "Core/GameBootstrap.cs").read_text(encoding="utf-8")
          assert "worldSize = 220.8f" in bootstrap and "CreateAndroidBuildingColliders(" in bootstrap and "CityVehicleCollider" in bootstrap, "Expanded city, door gaps, and vehicle colliders must be present"
          assert "BuildAndroidSkyGuideBeacon();" in bootstrap and "BlueSkyGuideBeamCore" in bootstrap, "Blue sky-to-ground guide beacon must be built"
          assert "minimapPickups" in flow and "AndroidSkyGuideBeaconPoint" in flow and "B: BEACON" in flow, "Minimap must display loot and the blue guide beacon"
          assert "survivorCount.ToString()" in flow and "SCORE  " in flow, "HUD counters must be dynamic and correctly labeled"
          enemy = (scripts / "Enemy/EnemyChase.cs").read_text(encoding="utf-8")
          assert "new Color(0.10f, 0.55f, 1f)" in enemy, "Enemy projectiles must be blue"
          audio = scripts / "Core/RuntimeGameAudio.cs"
          assert audio.exists() and "BuildMusicLoop()" in audio.read_text(encoding="utf-8") and "PlayPlayerShot()" in audio.read_text(encoding="utf-8"), "Runtime music and shot audio must be present"
          hud = (scripts / "UI/RuntimeCombatHUD.cs").read_text(encoding="utf-8")
          assert "fontSize = 18" in hud and "fontSize = 24" in hud, "Player HUD text must be larger"
          assert "private const float BaseActionHitRadius = 122f;" in hub, "Action touch zones must not inherit the enlarged movement-joystick radius"
          assert hub.count("float actionHitRadius = BaseActionHitRadius * scale * controlScale;") == 2, "Real touch and IMGUI fallback must share the same action hit radius"
          fallback_start = hub.index("private void HandleGuiPointerFallback()")
          fallback_end = hub.index("private void CreateGuiTextures()", fallback_start)
          fallback = hub[fallback_start:fallback_end]
          assert "if (Application.isMobilePlatform)\n                return;" not in fallback, "Android must not exit the IMGUI fallback before checking whether legacy touches are missing."
          assert "Input.touchCount > 0" in fallback and "guiFallbackOwnsPointer" in fallback, "Android fallback must defer to real fingers but recover when touch entries are absent."
          assert "private void HandleHeroSelectTouches()" in flow and "HeroSelectionContinuedByTouch" in flow, "Hero selection/continue must accept direct Android touches."
          assert "startRect.Contains(screen)" in flow and "StartMatch();" in flow, "Start Match must accept direct Android touches."
          assert "Screen.height - bottom - 236f * scale" in hub and "Screen.height - bottom - 300f * scale" in hub, "Grenade/reload hit zones must remain separate from adjacent actions"

          # Test every circular action hit zone across the configured minimum/maximum UI scales.
          import math
          for scale in (0.75, 1.0, 1.35):
              radius = 122.0 * scale * 1.12
              centers = {
                  "fire": (104.0, 58.0, 1.02),
                  "melee": (352.0, 18.0, 0.76),
                  "grenade": (352.0, 236.0, 0.76),
                  "reload": (104.0, 300.0, 0.72),
              }
              names = list(centers)
              for i, left in enumerate(names):
                  for right in names[i+1:]:
                      lx, ly, lr = centers[left]
                      rx, ry, rr = centers[right]
                      distance = math.hypot(lx-rx, ly-ry) * scale
                      min_separation = (lr + rr) * radius
                      assert distance >= min_separation, f"{left}/{right} button hit-zones overlap at UI scale {scale}: {distance:.1f} < {min_separation:.1f}"

          # Both runtime branches must run the same explicit input activation method.
          assert flow.count("mobileInput.ActivateForMatch(player, activeCamera);") == 2, "Android and desktop/editor must activate the input hub explicitly"
          assert "mobileInput.EnableMinimap();" in flow, "The existing non-Android minimap path must be retained"
          print("Mobile input ownership, active scene references, multi-touch capture, and lifecycle resets: PASS")
          PY
