name: Unity Android Build

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Unity branch or commit to build'
        required: true
        default: 'unity-2.5d'
        type: string
  push:
    branches:
      - unity-2.5d
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android-build.yml'

concurrency:
  group: persiawar-unity-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Unity project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate required Unity files and settings
        shell: bash
        run: |
          set -euo pipefail
          test -f UnityProject/ProjectSettings/ProjectVersion.txt
          test -f UnityProject/ProjectSettings/ProjectSettings.asset
          test -f UnityProject/ProjectSettings/EditorBuildSettings.asset
          test -f UnityProject/Packages/manifest.json
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity.meta
          test -f UnityProject/Assets/Resources/PersiaWarLit.shader
          test -f UnityProject/Assets/Scripts/Core/GameBootstrap.cs
          test -f UnityProject/Assets/Scripts/Core/RuntimeMaterialFactory.cs
          grep -q 'Assets/Scenes/PersiaWarPrototype.unity' UnityProject/ProjectSettings/EditorBuildSettings.asset
          grep -q 'm_Name: GameRoot' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q 'm_Name: Main Camera' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q '^  AndroidMinSdkVersion: 23$' UnityProject/ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidTargetSdkVersion: 35$' UnityProject/ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidTargetArchitectures: 2$' UnityProject/ProjectSettings/ProjectSettings.asset
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('UnityProject/Packages/manifest.json').read_text(encoding='utf-8'))
          print('Packages/manifest.json: valid JSON')
          PY
          scene_guid=$(awk '/^guid: / {print $2; exit}' UnityProject/Assets/Scenes/PersiaWarPrototype.unity.meta)
          build_guid=$(awk '/path: Assets\/Scenes\/PersiaWarPrototype.unity$/{getline; if ($0 ~ /guid:/) {print $2}}' UnityProject/ProjectSettings/EditorBuildSettings.asset)
          test -n "${scene_guid}"
          test -n "${build_guid}"
          test "${scene_guid}" = "${build_guid}"
          missing_meta=0
          while IFS= read -r -d '' file; do
            if [[ "${file}" == *.meta ]]; then
              continue
            fi
            if [[ ! -f "${file}.meta" ]]; then
              echo "Missing Unity .meta file: ${file}"
              missing_meta=1
            fi
          done < <(find UnityProject/Assets -type f -print0)
          test "${missing_meta}" -eq 0
          echo 'Unity project structure/settings validation passed.'

      - name: Report Unity version
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^m_EditorVersion:' UnityProject/ProjectSettings/ProjectVersion.txt

      - name: Check for tracked build outputs
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(Library|Temp|Obj|Builds?)/' >/dev/null; then
            echo 'Tracked Unity build/cache output detected.'
            exit 1
          fi
          echo 'Repository hygiene validation passed.'

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}
          lfs: true

      - name: Prepare Unity activation
        id: prepare-license
        shell: bash
        env:
          UNITY_LICENSE_INPUT: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL_INPUT: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL_INPUT: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_INPUT: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "${UNITY_EMAIL_INPUT}" ]] || { echo "::error::UNITY_EMAIL secret is missing."; exit 1; }
          [[ -n "${UNITY_PASSWORD_INPUT}" ]] || { echo "::error::UNITY_PASSWORD secret is missing."; exit 1; }

          license="${UNITY_LICENSE_INPUT#$'\\ufeff'}"
          license="$(printf '%s' "$license" | sed 's/^ *//; s/ *$//')"
          serial="$(printf '%s' "${UNITY_SERIAL_INPUT}" | sed 's/^ *//; s/ *$//')"

          export_ulf() {
            local ulf="$1"
            test -s "$ulf"
            grep -q '<UnityLicense' "$ulf"
            {
              echo "UNITY_LICENSE<<UNITY_LICENSE_EOF"
              cat "$ulf"
              echo
              echo "UNITY_LICENSE_EOF"
            } >> "$GITHUB_ENV"
            echo "Unity license prepared from a valid .ulf file."
          }

          if [[ -n "$serial" ]]; then
            if printf '%s' "$serial" | grep -Eq '^([A-Z0-9]{2}-[A-Z0-9]{4})(-[A-Z0-9]{4}){3,5}$'; then
              {
                echo "UNITY_SERIAL<<UNITY_SERIAL_EOF"
                printf '%s\n' "$serial"
                echo "UNITY_SERIAL_EOF"
              } >> "$GITHUB_ENV"
              echo "Unity activation mode: serial."
              exit 0
            fi
            echo "::error::UNITY_SERIAL is not in a recognized serial format."
            exit 1
          fi

          # Reuse an existing valid ULF when available.
          if printf '%s' "$license" | grep -q '<UnityLicense'; then
            tmp_ulf="$(mktemp)"
            printf '%s\n' "$license" > "$tmp_ulf"
            export_ulf "$tmp_ulf"
            rm -f "$tmp_ulf"
            exit 0
          fi

          decoded=""
          if [[ -n "$license" ]]; then
            decoded="$(printf '%s' "$license" | base64 -d 2>/dev/null || true)"
          fi
          if printf '%s' "$decoded" | grep -q '<UnityLicense'; then
            tmp_ulf="$(mktemp)"
            printf '%s\n' "$decoded" > "$tmp_ulf"
            export_ulf "$tmp_ulf"
            rm -f "$tmp_ulf"
            echo "Existing base64-encoded .ulf was accepted."
            exit 0
          fi

          echo "UNITY_LICENSE is not a usable .ulf. Falling back to automatic Personal-license activation."

      - name: Set up Node.js for automatic Personal activation
        if: ${{ env.UNITY_SERIAL == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Request Unity activation file
        if: ${{ env.UNITY_SERIAL == '' }}
        id: request-alf
        uses: game-ci/unity-request-activation-file@v2

      - name: Convert ALF to ULF using Unity account
        if: ${{ env.UNITY_SERIAL == '' }}
        shell: bash
        env:
          UNITY_EMAIL_INPUT: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_INPUT: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          npm install --global unity-license-activate@0.3.9

          alf="${{ steps.request-alf.outputs.filePath }}"
          test -f "$alf"
          echo "Received Unity activation request: $alf"

          rm -f ./*.ulf
          unity-license-activate "$UNITY_EMAIL_INPUT" "$UNITY_PASSWORD_INPUT" "$alf"

          ulf="$(find . -maxdepth 2 -type f -name '*.ulf' -print -quit)"
          if [[ -z "$ulf" ]]; then
            echo "::error::Unity did not return a .ulf license file."
            exit 1
          fi
          if ! grep -q '<UnityLicense' "$ulf"; then
            echo "::error::Downloaded .ulf does not contain UnityLicense XML."
            exit 1
          fi

          {
            echo "UNITY_LICENSE<<UNITY_LICENSE_EOF"
            cat "$ulf"
            echo
            echo "UNITY_LICENSE_EOF"
          } >> "$GITHUB_ENV"

          echo "Automatic Unity Personal license acquisition succeeded."

      - name: Validate final Unity activation payload
        shell: bash
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          if [[ -n "${UNITY_SERIAL}" ]]; then
            echo "Final activation payload: serial."
            exit 0
          fi
          [[ -n "${UNITY_LICENSE}" ]] || { echo "::error::No final Unity activation payload available."; exit 1; }
          printf '%s' "${UNITY_LICENSE}" | grep -q '<UnityLicense'
          echo 'Final activation payload is valid .ulf XML.'

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-UnityProject-Android-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            Library-UnityProject-Android-
            Library-UnityProject-
            Library-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          targetPlatform: Android
          androidTargetSdkVersion: '35'
          versioning: Semantic
          buildName: PersiaWar
          androidExportType: androidPackage
          androidSymbolType: none

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -d build/Android
          apk=$(find build/Android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          echo "Verified APK: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersiaWar-Unity-Android-${{ github.sha }}
          path: build/Android/*.apk
          if-no-files-found: error

# Build trigger: 2026-09-30 automatic Personal-license fallback
