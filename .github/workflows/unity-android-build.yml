name: Unity Android Build

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Unity branch or commit to build'
        required: true
        default: 'unity-2.5d'
        type: string

jobs:
  build-android:
    name: Build Unity Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected Unity branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}
          fetch-depth: 1

      - name: Validate Unity project
        shell: bash
        run: |
          set -euo pipefail
          test -f UnityProject/ProjectSettings/ProjectVersion.txt
          test -d UnityProject/Assets
          echo "Unity project detected"
          grep -E '^m_EditorVersion:' UnityProject/ProjectSettings/ProjectVersion.txt || true

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: UnityProject
          targetPlatform: Android
          versioning: Semantic
          androidExportType: androidPackage
          androidSymbolType: none

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Android
          found="$(find . -type f -name '*.apk' -print -quit)"
          if [ -z "$found" ]; then
            echo "No APK was produced"
            exit 1
          fi
          echo "APK found: $found"
          cp "$found" build/Android/PersiaWar-Unity.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersiaWar-Unity-Android
          path: build/Android/PersiaWar-Unity.apk
          if-no-files-found: error
