name: Unity Android Build

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Unity branch or commit to build'
        required: true
        default: 'unity-2.5d'
        type: string
  push:
    branches:
      - unity-2.5d
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android-build.yml'

concurrency:
  group: persiawar-unity-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Unity project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate required Unity files
        shell: bash
        run: |
          set -euo pipefail
          test -f UnityProject/ProjectSettings/ProjectVersion.txt
          test -f UnityProject/ProjectSettings/EditorBuildSettings.asset
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          test -f UnityProject/Assets/Resources/PersiaWarLit.shader
          test -f UnityProject/Assets/Scripts/Core/GameBootstrap.cs
          test -f UnityProject/Assets/Scripts/Core/RuntimeMaterialFactory.cs
          grep -q 'Assets/Scenes/PersiaWarPrototype.unity' UnityProject/ProjectSettings/EditorBuildSettings.asset
          grep -q 'm_Name: GameRoot' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q 'm_Name: Main Camera' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          echo 'Unity project structure validation passed.'

      - name: Report Unity version
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^m_EditorVersion:' UnityProject/ProjectSettings/ProjectVersion.txt

      - name: Check for tracked build outputs
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(Library|Temp|Obj|Builds?)/' >/dev/null; then
            echo 'Tracked Unity build/cache output detected.'
            exit 1
          fi
          echo 'Repository hygiene validation passed.'

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}
          lfs: true

      - name: Check Unity Personal activation configuration
        id: activation
        shell: bash
        run: |
          set -euo pipefail

          has_license=false
          has_email=false
          has_password=false

          [[ -n "${UNITY_LICENSE}" ]] && has_license=true
          [[ -n "${UNITY_EMAIL}" ]] && has_email=true
          [[ -n "${UNITY_PASSWORD}" ]] && has_password=true

          echo "UNITY_LICENSE present: ${has_license}"
          echo "UNITY_EMAIL present: ${has_email}"
          echo "UNITY_PASSWORD present: ${has_password}"

          if [[ "${has_license}" != "true" || "${has_email}" != "true" || "${has_password}" != "true" ]]; then
            echo 'Unity Personal activation configuration is incomplete.'
            echo 'Required repository secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.'
            exit 1
          fi

          echo 'Unity Personal activation secrets are available to GameCI.'

      - name: Validate UNITY_LICENSE format without exposing it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          value = os.environ.get('UNITY_LICENSE', '')
          if not value.strip():
              raise SystemExit('UNITY_LICENSE is empty')

          try:
              root = ET.fromstring(value)
          except ET.ParseError as exc:
              raise SystemExit(f'UNITY_LICENSE is not valid XML: line {exc.position[0]}, column {exc.position[1]}')

          if root.tag != 'root':
              raise SystemExit(f'UNITY_LICENSE XML root is unexpected: {root.tag!r}')

          license_nodes = root.findall('License')
          if len(license_nodes) != 1:
              raise SystemExit('UNITY_LICENSE must contain exactly one License element')

          license_node = license_nodes[0]
          if license_node.get('id') != 'Terms':
              raise SystemExit('UNITY_LICENSE License element does not have id="Terms"')

          if root.find('Signature') is None:
              raise SystemExit('UNITY_LICENSE is missing the XML Signature element')

          serial_masked = license_node.find('SerialMasked')
          entitlements = license_node.find('Entitlements')
          if serial_masked is None or entitlements is None:
              raise SystemExit('UNITY_LICENSE is missing expected Personal license fields')

          print(f'UNITY_LICENSE XML structure: valid (chars={len(value)})')
          PY

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-UnityProject-Android-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            Library-UnityProject-Android-
            Library-UnityProject-
            Library-

      - name: Build Unity project
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: UnityProject
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          versioning: Semantic
          buildName: PersiaWar
          androidExportType: androidPackage
          androidSymbolType: none

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -d build/Android
          apk=$(find build/Android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          echo "Verified APK: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersiaWar-Android-${{ github.sha }}
          path: build/Android/*.apk
          if-no-files-found: error
