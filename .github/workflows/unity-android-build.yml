name: Unity Android Build

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Unity branch or commit to build'
        required: true
        default: 'unity-2.5d'
        type: string
  push:
    branches:
      - unity-2.5d
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android-build.yml'

concurrency:
  group: persiawar-unity-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Unity project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate required Unity files and settings
        shell: bash
        run: |
          set -euo pipefail
          test -f UnityProject/ProjectSettings/ProjectVersion.txt
          test -f UnityProject/ProjectSettings/ProjectSettings.asset
          test -f UnityProject/ProjectSettings/EditorBuildSettings.asset
          test -f UnityProject/Packages/manifest.json
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity.meta
          test -f UnityProject/Assets/Resources/PersiaWarLit.shader
          test -f UnityProject/Assets/Scripts/Core/GameBootstrap.cs
          test -f UnityProject/Assets/Scripts/Core/RuntimeMaterialFactory.cs
          grep -q 'Assets/Scenes/PersiaWarPrototype.unity' UnityProject/ProjectSettings/EditorBuildSettings.asset
          grep -q 'm_Name: GameRoot' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q 'm_Name: Main Camera' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q '^  AndroidMinSdkVersion: 23$' UnityProject/ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidTargetSdkVersion: 35$' UnityProject/ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidTargetArchitectures: 2$' UnityProject/ProjectSettings/ProjectSettings.asset
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('UnityProject/Packages/manifest.json').read_text(encoding='utf-8'))
          print('Packages/manifest.json: valid JSON')
          PY
          scene_guid=$(awk '/^guid: / {print $2; exit}' UnityProject/Assets/Scenes/PersiaWarPrototype.unity.meta)
          build_guid=$(awk '/path: Assets\/Scenes\/PersiaWarPrototype.unity$/{getline; if ($0 ~ /guid:/) {print $2}}' UnityProject/ProjectSettings/EditorBuildSettings.asset)
          test -n "${scene_guid}"
          test -n "${build_guid}"
          test "${scene_guid}" = "${build_guid}"
          missing_meta=0
          while IFS= read -r -d '' file; do
            if [[ "${file}" == *.meta ]]; then
              continue
            fi
            if [[ ! -f "${file}.meta" ]]; then
              echo "Missing Unity .meta file: ${file}"
              missing_meta=1
            fi
          done < <(find UnityProject/Assets -type f -print0)
          test "${missing_meta}" -eq 0
          echo 'Unity project structure/settings validation passed.'

      - name: Report Unity version
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^m_EditorVersion:' UnityProject/ProjectSettings/ProjectVersion.txt

      - name: Check for tracked build outputs
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(Library|Temp|Obj|Builds?)/' >/dev/null; then
            echo 'Tracked Unity build/cache output detected.'
            exit 1
          fi
          echo 'Repository hygiene validation passed.'

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}
          lfs: true

      - name: Prepare Unity activation for GameCI
        shell: bash
        env:
          UNITY_LICENSE_INPUT: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL_INPUT: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          raw = os.environ.get('UNITY_LICENSE_INPUT', '').lstrip('\ufeff').strip()
          serial = os.environ.get('UNITY_SERIAL_INPUT', '').strip()

          def clean(value):
              value = value.lstrip('\ufeff').strip()
              if value.startswith('UNITY_LICENSE='):
                  value = value.split('=', 1)[1].strip()
              if (value.startswith('"') and value.endswith('"')) or (value.startswith("'") and value.endswith("'")):
                  value = value[1:-1].strip()
              if '\\n' in value and '<' in value:
                  value = value.replace('\\n', '\n').replace('\\r', '')
              return value.strip()

          raw = clean(raw)
          serial = clean(serial)
          serial_pattern = re.compile(r'^(?:[A-Z]{2}/[A-Z]{2}/[A-Z0-9-]+|[A-Z0-9]{2}-[A-Z0-9]{4}(?:-[A-Z0-9]{4}){3,5})$')

          if serial:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
                  fh.write('UNITY_SERIAL<<__UNITY_SERIAL_EOF__\n')
                  fh.write(serial + '\n')
                  fh.write('__UNITY_SERIAL_EOF__\n')
              print('Unity serial activation selected from UNITY_SERIAL.')
              raise SystemExit(0)

          if not raw:
              raise SystemExit('No Unity activation credential is available. Set UNITY_LICENSE (ULF) or UNITY_SERIAL.')

          if serial_pattern.fullmatch(raw) and '<' not in raw:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
                  fh.write('UNITY_SERIAL<<__UNITY_SERIAL_EOF__\n')
                  fh.write(raw + '\n')
                  fh.write('__UNITY_SERIAL_EOF__\n')
              print('UNITY_LICENSE contains a serial-shaped value; using it as UNITY_SERIAL.')
              raise SystemExit(0)

          lowered = raw.lower()
          if '<' in raw and any(tag in lowered for tag in ('machineidentification', 'licenserequest', 'activationrequest')):
              raise SystemExit('UNITY_LICENSE contains a Unity activation request (.alf), not a downloaded license (.ulf). Replace the UNITY_LICENSE secret with the contents of the .ulf license file from Unity.')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n') as fh:
              fh.write('UNITY_LICENSE<<__UNITY_LICENSE_EOF__\n')
              fh.write(raw)
              fh.write('\n__UNITY_LICENSE_EOF__\n')

          print('Unity license payload prepared for GameCI.')
          PY

      - name: Confirm normalized activation environment
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${UNITY_EMAIL}" ]]
          [[ -n "${UNITY_PASSWORD}" ]]
          if [[ -n "${UNITY_SERIAL:-}" ]]; then
            echo 'Unity serial activation environment is ready for GameCI.'
          elif [[ -n "${UNITY_LICENSE:-}" ]]; then
            echo 'Unity Personal license activation environment is ready for GameCI.'
          else
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-UnityProject-Android-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            Library-UnityProject-Android-
            Library-UnityProject-
            Library-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          projectPath: UnityProject
          targetPlatform: Android
          androidTargetSdkVersion: '35'
          versioning: Semantic
          buildName: PersiaWar
          androidExportType: androidPackage
          androidSymbolType: none

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -d build/Android
          apk=$(find build/Android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          echo "Verified APK: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersiaWar-Android-${{ github.sha }}
          path: build/Android/*.apk
          if-no-files-found: error

