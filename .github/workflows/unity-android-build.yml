name: Unity Android Build

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Unity branch or commit to build'
        required: true
        default: 'unity-2.5d'
        type: string
  push:
    branches:
      - unity-2.5d
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android-build.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: persiawar-unity-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Unity project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate required Unity files and settings
        shell: bash
        run: |
          set -euo pipefail
          test -f UnityProject/ProjectSettings/ProjectVersion.txt
          test -f UnityProject/ProjectSettings/ProjectSettings.asset
          test -f UnityProject/ProjectSettings/EditorBuildSettings.asset
          test -f UnityProject/Packages/manifest.json
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity.meta
          test -f UnityProject/Assets/Resources/PersiaWarLit.shader
          test -f UnityProject/Assets/Scripts/Core/GameBootstrap.cs
          test -f UnityProject/Assets/Scripts/Core/RuntimeMaterialFactory.cs
          grep -q 'Assets/Scenes/PersiaWarPrototype.unity' UnityProject/ProjectSettings/EditorBuildSettings.asset
          grep -q 'm_Name: GameRoot' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q 'm_Name: Main Camera' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q '^  AndroidMinSdkVersion: 23$' UnityProject/ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidTargetSdkVersion: 35$' UnityProject/ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidTargetArchitectures: 2$' UnityProject/ProjectSettings/ProjectSettings.asset
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('UnityProject/Packages/manifest.json').read_text(encoding='utf-8'))
          print('Packages/manifest.json: valid JSON')
          PY
          scene_guid=$(awk '/^guid: / {print $2; exit}' UnityProject/Assets/Scenes/PersiaWarPrototype.unity.meta)
          build_guid=$(awk '/path: Assets\/Scenes\/PersiaWarPrototype.unity$/{getline; if ($0 ~ /guid:/) {print $2}}' UnityProject/ProjectSettings/EditorBuildSettings.asset)
          test -n "${scene_guid}"
          test -n "${build_guid}"
          test "${scene_guid}" = "${build_guid}"
          missing_meta=0
          while IFS= read -r -d '' file; do
            if [[ "${file}" == *.meta ]]; then
              continue
            fi
            if [[ ! -f "${file}.meta" ]]; then
              echo "Missing Unity .meta file: ${file}"
              missing_meta=1
            fi
          done < <(find UnityProject/Assets -type f -print0)
          test "${missing_meta}" -eq 0
          echo 'Unity project structure/settings validation passed.'

      - name: Report Unity version
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^m_EditorVersion:' UnityProject/ProjectSettings/ProjectVersion.txt

      - name: Check for tracked build outputs
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(Library|Temp|Obj|Builds?)/' >/dev/null; then
            echo 'Tracked Unity build/cache output detected.'
            exit 1
          fi
          echo 'Repository hygiene validation passed.'

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}
          lfs: true

      - name: Validate Unity Personal credentials
        shell: bash
        env:
          UNITY_EMAIL_INPUT: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_INPUT: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${UNITY_EMAIL_INPUT}" ]] || { echo "::error::UNITY_EMAIL secret is missing."; exit 1; }
          [[ -n "${UNITY_PASSWORD_INPUT}" ]] || { echo "::error::UNITY_PASSWORD secret is missing."; exit 1; }
          echo "Unity Personal credentials are present. The build will use GameCI's current licensing client path."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-UnityProject-Android-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            Library-UnityProject-Android-
            Library-UnityProject-
            Library-

      - name: Build Unity Android APK directly
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          IMAGE="unityci/editor:2022.3.62f1-android-3"

          mkdir -p .ci
          trap 'rm -f .ci/unity-build.sh; rm -f UnityProject/Assets/Editor/PersiaWarCiBuild.cs; rmdir UnityProject/Assets/Editor 2>/dev/null || true' EXIT

          mkdir -p UnityProject/Assets/Editor
          cat > UnityProject/Assets/Editor/PersiaWarCiBuild.cs <<'CS'
          using System;
          using System.IO;
          using UnityEditor;
          using UnityEditor.Build.Reporting;

          public static class PersiaWarCiBuild
          {
              public static void BuildAndroid()
              {
                  var output = "build/Android/PersiaWar.apk";
                  Directory.CreateDirectory("build/Android");

                  var scenes = new System.Collections.Generic.List<string>();
                  foreach (var scene in EditorBuildSettings.scenes)
                  {
                      if (scene.enabled)
                          scenes.Add(scene.path);
                  }

                  if (scenes.Count == 0)
                      throw new Exception("No enabled scenes found in EditorBuildSettings.");

                  var report = BuildPipeline.BuildPlayer(
                      scenes.ToArray(),
                      output,
                      BuildTarget.Android,
                      BuildOptions.None
                  );

                  if (report.summary.result != BuildResult.Succeeded)
                      throw new Exception("Unity Android build failed: " + report.summary.result);

                  if (report.summary.totalErrors > 0)
                      throw new Exception("Unity Android build reported " + report.summary.totalErrors + " error(s).");

                  if (!File.Exists(output) || new FileInfo(output).Length == 0)
                      throw new Exception("Unity reported success but APK file is missing or empty.");

                  Console.WriteLine("UNITY_BUILD_SUCCEEDED:" + output);
              }
          }
          CS

          cat > .ci/unity-build.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          NODE_VERSION="22.14.0"
          NODE_ROOT="/opt/node-v22.14.0-linux-x64"
          export PATH="/opt/node-v22.14.0-linux-x64/bin:$PATH"

          echo "=== Preparing Node.js 22 ==="
          if [[ ! -x "/opt/node-v22.14.0-linux-x64/bin/node" ]]; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl wget gnupg xz-utils
            curl -fsSL "https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz" -o /tmp/node.tar.xz
            rm -rf "/opt/node-v22.14.0-linux-x64"
            tar -xJf /tmp/node.tar.xz -C /opt
            rm -f /tmp/node.tar.xz
          fi
          node --version
          npm --version

          echo "=== Installing Unity Hub ==="
          if [[ ! -x /usr/lib/unityhub/unityhub && ! -x /opt/unityhub/unityhub ]]; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates wget gnupg xvfb
            mkdir -p /usr/share/keyrings
            wget -qO - https://hub.unity3d.com/linux/keys/public | gpg --dearmor > /usr/share/keyrings/Unity_Technologies_ApS.gpg
            rm -f /etc/apt/sources.list.d/unityhub.list
            cat > /etc/apt/sources.list.d/unityhub.sources <<'EOF'
          Types: deb
          URIs: https://hub.unity3d.com/linux/repos/deb
          Suites: stable
          Components: main
          Signed-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg
          EOF
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends unityhub
          fi

          if [[ -x /usr/lib/unityhub/unityhub ]]; then
            echo "Unity Hub found at /usr/lib/unityhub/unityhub"
          elif [[ -x /opt/unityhub/unityhub ]]; then
            echo "Unity Hub found at /opt/unityhub/unityhub"
          else
            echo "::error::Unity Hub binary was not found after installation."
            exit 1
          fi

          echo "=== Installing current Unity Licensing Client ==="
          rm -rf /tmp/unity-license-runtime
          mkdir -p /tmp/unity-license-runtime
          npm install --prefix /tmp/unity-license-runtime --no-save --no-package-lock @rage-against-the-pixel/unity-cli@2.0.0

          cat > /tmp/activate-unity.js <<'JS'
          const { LicensingClient, LicenseType } = require("@rage-against-the-pixel/unity-cli");

          (async () => {
            const email = process.env.UNITY_EMAIL;
            const password = process.env.UNITY_PASSWORD;

            if (!email || !password) {
              throw new Error("Unity credentials are missing.");
            }

            const client = new LicensingClient("6.x");

            console.log("Activating Unity Personal license...");
            await client.Activate({
              licenseType: LicenseType.personal,
              username: email,
              password,
            }, true);

            const active = await client.GetActiveEntitlements();
            console.log("Active Unity entitlements: " + active.join(", "));

            if (!active.includes(LicenseType.personal)) {
              throw new Error("Unity Personal entitlement is not active.");
            }

            console.log("UNITY_PERSONAL_LICENSE_ACTIVATED");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS

          NODE_PATH=/tmp/unity-license-runtime/node_modules node /tmp/activate-unity.js

          test -s /root/.local/share/unity3d/Unity/Unity_lic.ulf
          echo "Unity Personal license file created successfully."

          echo "=== Building existing Unity project ==="
          cd /workspace
          unity-editor \
            -batchmode \
            -nographics \
            -quit \
            -accept-apiupdate \
            -projectPath /workspace/UnityProject \
            -buildTarget Android \
            -executeMethod PersiaWarCiBuild.BuildAndroid \
            -logFile -

          test -s /workspace/build/Android/PersiaWar.apk
          echo "UNITY_APK_READY:/workspace/build/Android/PersiaWar.apk"
          SH
          chmod +x .ci/unity-build.sh

          rm -rf .ci-unity-home
          mkdir -p .ci-unity-home/.local/share/unity3d/Unity
          mkdir -p .ci-unity-home/.config/unity3d/Unity

          docker run --rm \
            -e UNITY_EMAIL="$UNITY_EMAIL" \
            -e UNITY_PASSWORD="$UNITY_PASSWORD" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/.ci-unity-home:/root" \
            -w /workspace \
            "$IMAGE" \
            bash /workspace/.ci/unity-build.sh

          test -s build/Android/PersiaWar.apk
          unzip -t build/Android/PersiaWar.apk >/dev/null
          echo "Verified Unity APK: build/Android/PersiaWar.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -d build/Android
          apk=$(find build/Android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          echo "Verified APK: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersiaWar-Unity-Android-${{ github.sha }}
          path: build/Android/*.apk
          if-no-files-found: error

