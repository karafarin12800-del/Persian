name: Unity Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - unity-2.5d
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android-build.yml'

concurrency:
  group: persiawar-unity-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Unity project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Unity files
        shell: bash
        run: |
          set -euo pipefail
          test -f UnityProject/ProjectSettings/ProjectVersion.txt
          test -f UnityProject/ProjectSettings/EditorBuildSettings.asset
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          test -f UnityProject/Assets/Resources/PersiaWarLit.shader
          test -f UnityProject/Assets/Scripts/Core/GameBootstrap.cs
          test -f UnityProject/Assets/Scripts/Core/RuntimeMaterialFactory.cs
          grep -q 'Assets/Scenes/PersiaWarPrototype.unity' UnityProject/ProjectSettings/EditorBuildSettings.asset
          grep -q 'm_Name: GameRoot' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q 'm_Name: Main Camera' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          echo 'Unity project structure validation passed.'

      - name: Check for tracked build outputs
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(Library|Temp|Obj|Builds?)/' >/dev/null; then
            echo 'Tracked Unity build/cache output detected.'
            exit 1
          fi
          echo 'Repository hygiene validation passed.'

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity activation configuration
        id: activation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${UNITY_LICENSE}" || ( -n "${UNITY_SERIAL}" && -n "${UNITY_EMAIL}" && -n "${UNITY_PASSWORD}" ) ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Unity activation configuration is present.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Unity activation is not configured. APK build is waiting for the repository Unity license secrets.'
          fi

      - name: Cache Unity Library
        if: steps.activation.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-UnityProject-Android-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            Library-UnityProject-Android-
            Library-UnityProject-
            Library-

      - name: Build Unity project
        if: steps.activation.outputs.ready == 'true'
        uses: game-ci/unity-builder@v4
        with:
          projectPath: UnityProject
          targetPlatform: Android
          versioning: Semantic
          buildName: PersiaWar
          androidExportType: androidPackage
          androidSymbolType: none

      - name: Verify APK
        if: steps.activation.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -d build/Android
          apk=$(find build/Android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          echo "Verified APK: $apk"

      - name: Upload APK
        if: steps.activation.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PersiaWar-Android-${{ github.sha }}
          path: build/Android/*.apk
          if-no-files-found: error
