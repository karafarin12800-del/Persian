name: Unity Android Build # Direct-start validation: 2026-10-01

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Unity branch or commit to build'
        required: true
        default: 'fix/android-multitouch-pointer-zones'
        type: string
  push:
    branches:
      - unity-2.5d
      - fix/android-multitouch-pointer-zones
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android-build.yml'
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: persiawar-unity-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Unity project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate required Unity files and settings
        shell: bash
        run: |
          set -euo pipefail
          test -f UnityProject/ProjectSettings/ProjectVersion.txt
          test -f UnityProject/ProjectSettings/ProjectSettings.asset
          test -f UnityProject/ProjectSettings/EditorBuildSettings.asset
          test -f UnityProject/Packages/manifest.json
          test -f UnityProject/Assets/Scenes/BootScene.unity
          test -f UnityProject/Assets/Scenes/BootScene.unity.meta
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          test -f UnityProject/Assets/Scenes/PersiaWarPrototype.unity.meta
          test -f UnityProject/Assets/Resources/PersiaWarLit.shader
          test -f UnityProject/Assets/Resources/PersiaWarAndroidFlat.shader
          test -f UnityProject/Assets/Resources/PersiaWarAndroidFlat.shader.meta
          test -f UnityProject/Assets/Resources/PersiaWarAndroidFade.shader
          test -f UnityProject/Assets/Resources/PersiaWarAndroidFade.shader.meta
          test -f UnityProject/Assets/Scripts/Core/GameBootstrap.cs
          test -f UnityProject/Assets/Scripts/Core/RuntimeMaterialFactory.cs
          test -f UnityProject/Assets/Scripts/Core/AndroidSafeRuntimeFactory.cs
          grep -q 'Assets/Scenes/BootScene.unity' UnityProject/ProjectSettings/EditorBuildSettings.asset
          grep -q 'Assets/Scenes/PersiaWarPrototype.unity' UnityProject/ProjectSettings/EditorBuildSettings.asset
          python3 - <<'PY'
          from pathlib import Path
          text = Path('UnityProject/ProjectSettings/EditorBuildSettings.asset').read_text(encoding='utf-8')
          boot = 'path: Assets/Scenes/BootScene.unity'
          game = 'path: Assets/Scenes/PersiaWarPrototype.unity'
          assert boot in text and game in text and text.index(boot) < text.index(game), 'BootScene must be Build Settings index 0'
          print('Build Settings scene order: BootScene -> PersiaWarPrototype')
          PY
          grep -q 'm_Name: GameRoot' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q 'm_Name: Main Camera' UnityProject/Assets/Scenes/PersiaWarPrototype.unity
          grep -q '^  AndroidMinSdkVersion: 23$' UnityProject/ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidTargetSdkVersion: 35$' UnityProject/ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidTargetArchitectures: 2$' UnityProject/ProjectSettings/ProjectSettings.asset
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('UnityProject/Packages/manifest.json').read_text(encoding='utf-8'))
          print('Packages/manifest.json: valid JSON')
          PY
          scene_guid=$(awk '/^guid: / {print $2; exit}' UnityProject/Assets/Scenes/PersiaWarPrototype.unity.meta)
          build_guid=$(awk '/path: Assets\/Scenes\/PersiaWarPrototype.unity$/{getline; if ($0 ~ /guid:/) {print $2}}' UnityProject/ProjectSettings/EditorBuildSettings.asset)
          test -n "${scene_guid}"
          test -n "${build_guid}"
          test "${scene_guid}" = "${build_guid}"
          missing_meta=0
          while IFS= read -r -d '' file; do
            if [[ "${file}" == *.meta ]]; then
              continue
            fi
            if [[ ! -f "${file}.meta" ]]; then
              echo "Missing Unity .meta file: ${file}"
              missing_meta=1
            fi
          done < <(find UnityProject/Assets -type f -print0)
          test "${missing_meta}" -eq 0
          grep -q 'Resources.Load<Sprite>' UnityProject/Assets/Scripts/Art/StylizedCharacterVisual.cs
          ! grep -q 'Sprite.Create(' UnityProject/Assets/Scripts/Art/StylizedCharacterVisual.cs
          grep -q 'followCamera.enabled = true' UnityProject/Assets/Scripts/Core/PrototypeFlow.cs
          grep -q 'if (minimapEnabled)' UnityProject/Assets/Scripts/Input/MobileInputHub.cs
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path('UnityProject/Assets/Scripts/Core/GameBootstrap.cs').read_text(encoding='utf-8')
          world_start = bootstrap.index('private void BuildWorldBase()')
          road_start = bootstrap.index('private void BuildAndroidRoadGrid()', world_start)
          world_method = bootstrap[world_start:road_start]
          android_start = world_method.index('#if UNITY_ANDROID')
          android_end = world_method.index('#else', android_start)
          android_path = world_method[android_start:android_end]
          assert 'AddComponent<Terrain3DBuilder>' not in android_path and 'terrain.Build()' not in android_path, 'Android first-match path still invokes Terrain3DBuilder.'
          assert 'GameObject.CreatePrimitive' not in android_path, 'Android first-match path still uses CreatePrimitive.'
          assert 'BuildAndroidTerrain3D(groundMaterial)' in android_path and 'return;' in android_path, 'Android safe 3D battlefield path is incomplete.'

          weapon = Path('UnityProject/Assets/Scripts/Combat/WeaponController.cs').read_text(encoding='utf-8')
          awake = weapon[weapon.index('private void Awake()'):weapon.index('private void EnsureProjectileTemplate()')]
          assert 'EnsureProjectileTemplate()' not in awake, 'Projectile template is still allocated during Player Awake.'

          visual = Path('UnityProject/Assets/Scripts/Art/StylizedCharacterVisual.cs').read_text(encoding='utf-8')
          presentation = visual[visual.index('private void EnsurePresentation()'):visual.index('private void LoadCharacterSprite()')]
          assert 'CreateMuzzleFlash()' not in presentation, 'Muzzle flash is still allocated during player presentation setup.'
          flat_shader = Path('UnityProject/Assets/Resources/PersiaWarAndroidFlat.shader').read_text(encoding='utf-8')
          factory = Path('UnityProject/Assets/Scripts/Core/RuntimeMaterialFactory.cs').read_text(encoding='utf-8')
          assert 'Shader "PersiaWar/AndroidFlat"' in flat_shader, 'Project-owned Android flat shader is missing.'
          assert 'return tex2D(_MainTex, i.uv) * _Color;' in flat_shader, 'Android flat shader must tint textures without lighting.'
          assert 'Resources.Load<Shader>("PersiaWarAndroidFlat")' in factory, 'Android does not prefer the bundled flat shader.'
          assert factory.index('Resources.Load<Shader>("PersiaWarAndroidFlat")') < factory.index('Shader.Find("Unlit/Texture")'), 'Built-in lookup runs before the bundled Android shader.'
          assert 'ApplyTintToSupportedColorProperties(material, color);' in factory, 'Runtime tint properties are not set explicitly.'
          assert 'DisableLegacyWorldBuilderPath();' in bootstrap, 'Android does not disable the retired gray-ground/dark-road generator.'
          legacy_world = Path('UnityProject/Assets/Scripts/World/WorldBuilder.cs').read_text(encoding='utf-8')
          assert 'new Color(0.12f, 0.46f, 0.08f)' in legacy_world and 'new Color(0.52f, 0.54f, 0.57f)' in legacy_world, 'Legacy fallback colors regress.'
          assert 'RuntimeMaterialFactory.Create(' in legacy_world, 'Legacy fallback materials bypass the runtime shader path.'
          fader = Path('UnityProject/Assets/Scripts/Core/CameraOcclusionFader.cs').read_text(encoding='utf-8')
          flow = Path('UnityProject/Assets/Scripts/Core/PrototypeFlow.cs').read_text(encoding='utf-8')
          assert 'Physics.SphereCastNonAlloc' in fader and 'Mathf.MoveTowards' in fader, 'Camera occlusion fade must detect blockers and transition smoothly.'
          fade_shader = Path('UnityProject/Assets/Resources/PersiaWarAndroidFade.shader').read_text(encoding='utf-8')
          assert 'Blend SrcAlpha OneMinusSrcAlpha' in fade_shader and 'ZWrite Off' in fade_shader, 'Fade shader must use genuine alpha blending.'
          assert 'Resources.Load<Shader>("PersiaWarAndroidFade")' in fader and 'r.sharedMaterials = fades;' in fader, 'Occlusion fader must swap to the transparent shader.'
          assert 'Physics.SphereCastNonAlloc' in fader and 'GetComponentsInChildren<Renderer>' in fader, 'Occlusion fader must resolve building collider to house renderers.'
          assert 'androidCurrentBuildingRoot' in bootstrap and 'FlushAndroidBoxBatches();' in bootstrap, 'Android houses must be independently batchable for selective fading.'
          box_factory_start = bootstrap.index('private GameObject CreateAndroidBox(')
          box_factory_end = bootstrap.index('private GameObject CreateFlatMesh(', box_factory_start)
          box_factory = bootstrap[box_factory_start:box_factory_end]
          assert 'androidCurrentBuildingRoot != null ? androidCurrentBuildingRoot : worldRoot' in box_factory, 'Pitched roofs and individual house details must remain children of their house for fading.'
          assert 'cameraObject.AddComponent<CameraOcclusionFader>()' in flow, 'Gameplay camera does not enable occlusion fade.'
          assert '148f * scale * 1.38f * 1.15f' in flow, 'Gameplay minimap is not enlarged by another 15 percent.'
          assert '0.42f));' in flow and '0.66f);' in flow, 'Gameplay minimap transparency has regressed.'
          weapon = Path('UnityProject/Assets/Scripts/Combat/WeaponController.cs').read_text(encoding='utf-8')
          assert 'LightPistolRange = 7.5f' in weapon and 'AssaultRifleRange = 13.5f' in weapon and 'HeavyMachineGunRange = 21f' in weapon, 'Player weapon ranges are not halved.'
          assert 'GetEffectiveRangeForKind(WeaponKind kind)' in weapon, 'Player/enemy shared weapon-kind range profile is missing.'
          assert 'case WeaponKind.LightPistol: return LightPistolRange;' in weapon and 'case WeaponKind.HeavyMachineGun: return HeavyMachineGunRange;' in weapon and 'default: return AssaultRifleRange;' in weapon, 'Shared profile does not cover every weapon kind.'
          enemy = Path('UnityProject/Assets/Scripts/Enemy/EnemyChase.cs').read_text(encoding='utf-8')
          assert 'WeaponController.GetEffectiveRangeForKind(DroppedWeaponKind)' in enemy, 'Enemy weapon range does not match the weapon it carries/drops.'
          assert 'ClampInsidePlayableArea();' in enemy, 'Enemy AI does not recover enemies beyond map boundaries.'
          assert 'ClampToPlayableArea(ref routeNext);' in enemy and 'ClampToPlayableArea(ref directNext);' in enemy, 'Enemy navigation can move beyond the playable map.'
          player = Path('UnityProject/Assets/Scripts/Player/PlayerController.cs').read_text(encoding='utf-8')
          assert 'public float WorldLimit => worldLimit;' in player, 'Enemy AI does not share the player world boundary setting.'
          assert 'PlanLocalRoute(' in enemy and 'Physics.OverlapSphereNonAlloc' in enemy and 'CanTravelDirectly(' in enemy, 'Enemy has no collider-aware route around walls.'
          assert 'private readonly RaycastHit[] navigationRayHits' in enemy and 'navigationRayHits[i].collider' in enemy, 'SphereCastNonAlloc must use RaycastHit results, not Collider results.'
          assert 'if (hit is MeshCollider)' in enemy, 'Enemy navigation must ignore the continuous ground mesh.'
          print('Camera occlusion fade regression checks: PASS')
          print('Android shader/legacy-ground regression checks: PASS')
          print('Android startup isolation checks: PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path

          spawner = Path('UnityProject/Assets/Scripts/World/EnemySpawner.cs').read_text(encoding='utf-8')
          assert spawner.count('enemy.AddComponent<EnemyHealthBar>();') == 2, 'Enemy health bar is not attached in both main spawn paths.'

          offscreen_spawner = Path('UnityProject/Assets/Scripts/World/OffscreenEnemySpawner.cs').read_text(encoding='utf-8')
          assert 'enemy.GetComponent<EnemyHealthBar>()' in offscreen_spawner and 'enemy.AddComponent<EnemyHealthBar>()' in offscreen_spawner, 'Offscreen enemy spawn path does not ensure a health bar.'

          enemy_bar = Path('UnityProject/Assets/Scripts/UI/EnemyHealthBar.cs').read_text(encoding='utf-8')
          assert 'WorldToScreenPoint' in enemy_bar and 'health.CurrentHealth' in enemy_bar and 'health.MaxHealth' in enemy_bar, 'Enemy health bar does not project numeric live health.'
          assert 'ResolveWorldCamera()' in enemy_bar and 'GUI.depth = -50;' in enemy_bar, 'Enemy health labels are not prioritized as screen-space overlays.'

          bootstrap = Path('UnityProject/Assets/Scripts/Core/GameBootstrap.cs').read_text(encoding='utf-8')
          city_start = bootstrap.index('private void BuildAndroidCityPresentation()')
          city_end = bootstrap.index('private void BuildAndroidAlleysAndVehicles()', city_start)
          city = bootstrap[city_start:city_end]
          assert 'Mathf.Lerp(3.25f, 3.95f' in city and 'Mathf.Lerp(5.4f, 6.4f' in city, 'Android houses are not constrained to one/two storeys.'
          assert 'bool isWarehouse = i == 4 || i == 9 || i == 11 || i == 16;' in city, 'Dedicated warehouse buildings are missing from the Android map.'
          assert 'CreateAndroidPitchedRoof' in bootstrap and 'bool isPitchedRoof' in city, 'Sloped-roof house variants are missing.'
          assert 'float bodyHeight = Mathf.Clamp(height, 3.2f, 6.5f);' in bootstrap, 'Android building body height is not capped at two storeys.'
          assert 'int windowRows = isWarehouse ? 1 : (bodyHeight >= 5.0f ? 2 : 1);' in bootstrap, 'Window rows can imply extra storeys.'
          assert 'i >= 22' in city and 'i >= 18 && i <= 21' in city, 'Close central building plots are not protected from oversized footprints.'

          flow = Path('UnityProject/Assets/Scripts/Core/PrototypeFlow.cs').read_text(encoding='utf-8')
          active_hud_start = flow.index('private void DrawAndroidPresentationHUD()')
          active_hud_end = flow.index('private void DrawPreviousRunDiagnostic()', active_hud_start)
          active_hud = flow[active_hud_start:active_hud_end]
          assert 'playerHealth.CurrentHealth' in active_hud and 'currentHealth + " / " + maxHealth' in active_hud, 'Active Android HUD does not show numeric player health.'
          assert 'player.Shield' in active_hud and 'SHIELD  ' in active_hud, 'Active Android HUD does not show player shield.'
          assert 'DrawStatusBar(' in active_hud, 'Active Android HUD has no health/shield bars.'

          android_pass_start = flow.index('// PASS 3: enable only the lightweight HUD')
          android_pass_end = flow.index('#else', android_pass_start)
          android_hud_activation = flow[android_pass_start:android_pass_end]
          assert 'combatHud.enabled = false;' in android_hud_activation, 'Overlapping secondary HUD must remain disabled on Android.'
          spawner = Path('UnityProject/Assets/Scripts/World/EnemySpawner.cs').read_text(encoding='utf-8')
          assert 'maxPerWave = Mathf.Clamp(maxPerWave, 1, 24);' in spawner, 'Android enemy wave cap must stay at or below 24.'
          assert 'startingCount = 24' in spawner and 'count = Mathf.Min(count, 24);' in spawner, 'Android match must start with 24 enemies.'
          assert 'Random.Range(-82f, 82f)' in spawner and 'Random.Range(-82f, 82f)' in spawner, 'Android opponents are not selected across the full map.'
          assert 'yield return new WaitForSecondsRealtime(0.15f);' in spawner, 'Android initial lobby still waits for the long desktop spawn delay.'

          assert 'enemySpawner.Configure(player.transform, 24, 84f, 0f);' in flow, 'Android match must start with 24 enemies.'
          assert 'float mapSize = Mathf.Clamp(148f * scale * 1.38f * 1.15f * 1.20f, 180f, 314f);' in active_hud, 'Active Android minimap must be enlarged by a further 20 percent.'
          assert 'FindObjectsByType<EnemyChase>(FindObjectsSortMode.None)' in active_hud and 'DrawCircle(enemyPoint, 7f * scale, new Color(0.22f, 0.56f, 0.98f, 1f))' in active_hud and 'new Color(0.035f, 0.075f, 0.24f, 1f)' in active_hud, 'Minimap enemy markers must be twice as large with a clear navy center.'
          assert 'AndroidMinimapBuildingPoints' in active_hud and 'AndroidMinimapRoadCoordinates' in active_hud, 'Minimap city roads/buildings are incomplete.'
          assert 'new Vector2(-79f, -79f)' in flow and 'new Vector2(65f, 89f)' in flow, 'Minimap house locations do not cover the actual Android city layout.'
          assert 'Fill(map, new Color(0.12f, 0.28f, 0.12f, 0.42f))' in active_hud, 'Active Android minimap must remain more transparent while retaining its green tint.'
          assert 'new Color(0.96f, 0.68f, 0.30f, 1f)' in active_hud and 'new Color(0.12f, 0.075f, 0.035f, 0.98f)' in active_hud, 'Minimap houses need high-contrast fill and outline.'
          assert 'new Color(0.12f, 0.46f, 0.08f)' in bootstrap, 'Android grass must remain green.'
          assert 'new Color(0.52f, 0.54f, 0.57f)' in bootstrap, 'Android asphalt must remain light gray.'

          enemy_ai = Path('UnityProject/Assets/Scripts/Enemy/EnemyChase.cs').read_text(encoding='utf-8')
          assert 'EnemyRifleVisual' in enemy_ai and 'RifleBarrel' in enemy_ai, 'Enemy characters do not have visible rifle geometry.'
          assert 'visual.WeaponMount' in enemy_ai and 'weaponVisualRoot.SetParent(mount, false);' in enemy_ai, 'Enemy rifle is not attached to the visible character hand/body mount.'
          visual = Path('UnityProject/Assets/Scripts/Art/StylizedCharacterVisual.cs').read_text(encoding='utf-8')
          assert 'public Transform WeaponMount => mobileModelRoot != null ? mobileModelRoot : transform;' in visual, 'Mobile weapon mount is missing.'
          assert 'shot.Configure(shotDirection, rangedDamage, transform, rangedRange);' in enemy_ai, 'Enemy ranged attacks are not wired to the projectile system with an effective range.'
          assert 'retargetInterval = Application.isMobilePlatform ? 0.22f : 0.12f;' in enemy_ai, 'Enemy AI update cadence is not bounded for the full mobile lobby.'
          assert 'retreatUntil = Time.time + retreatDuration;' in enemy_ai and 'TrackMovementProgress();' in enemy_ai and 'ChooseRecoveryDirection()' in enemy_ai, 'Enemy AI must time-box retreat and recover from corner/wall stalls.'

          weapon = Path('UnityProject/Assets/Scripts/Combat/WeaponController.cs').read_text(encoding='utf-8')
          assert 'enum WeaponKind' in weapon and 'public void CycleWeapon()' in weapon, 'Weapon profiles cannot be cycled at runtime.'
          assert 'public float EffectiveRange => Mathf.Max(1f, weaponRange);' in weapon, 'Weapon range is not exposed to aiming and HUD.'
          assert 'LightPistolRange = 7.5f' in weapon and 'AssaultRifleRange = 13.5f' in weapon and 'HeavyMachineGunRange = 21f' in weapon, 'Weapon profiles must have distinct halved light/rifle/heavy ranges.'
          assert 'PistolSlide' in weapon and 'PistolGrip' in weapon, 'The light pistol still uses only a scaled rifle silhouette.'
          assert 'SetWeaponPart("PistolSlide", pistol' in weapon and 'SetWeaponPart("Stock", !pistol' in weapon, 'Weapon profiles do not swap actual visible parts.'
          assert 'heavy ? new Vector3(0.26f, 0.20f, 0.64f)' in weapon and 'heavy ? new Vector3(0.16f, 0.34f, 0.21f)' in weapon, 'Heavy weapon receiver/magazine are not visually distinct.'
          assert 'public float MoveSpeedMultiplier =>' in weapon and 'WeaponKind.LightPistol' in weapon and '1.20f' in weapon and 'weaponKind == WeaponKind.HeavyMachineGun ? 0.78f' in weapon, 'Weapon weight does not affect player movement speed.'
          assert 'EnsureRangeIndicator()' in weapon and 'rangeRing.SetPosition' in weapon, 'Dynamic yellow weapon-range ring is missing.'
          assert 'new Color(1f, 0.82f, 0.08f, 1f)' in weapon, 'Range indicator is not yellow.'

          player_controller = Path('UnityProject/Assets/Scripts/Player/PlayerController.cs').read_text(encoding='utf-8')
          assert 'weapon.MoveSpeedMultiplier' in player_controller, 'Player movement is not linked to the active weapon weight.'
          aim = Path('UnityProject/Assets/Scripts/Combat/NearestTargetAim.cs').read_text(encoding='utf-8')
          assert 'Mathf.Min(range, weapon.EffectiveRange)' in aim, 'Auto-targeting can select opponents beyond the current weapon range.'

          input_hub = Path('UnityProject/Assets/Scripts/Input/MobileInputHub.cs').read_text(encoding='utf-8')
          assert 'Input.multiTouchEnabled = true;' in input_hub, 'Android must use multi-touch.'
          assert 'Input.simulateMouseWithTouches = false;' not in input_hub, 'Keep touch-to-mouse simulation enabled for IMGUI controls; suppress it only inside the custom mobile pointer dispatcher.'
          gui_fallback_start = input_hub.index('private void HandleGuiPointerFallback()')
          gui_fallback_end = input_hub.index('private void CreateGuiTextures()', gui_fallback_start)
          gui_fallback = input_hub[gui_fallback_start:gui_fallback_end]
          assert 'Input.touchCount > 0' in gui_fallback and 'guiFallbackOwnsPointer' in gui_fallback, 'Android GUI fallback must defer to real touch IDs but recover when legacy touch entries are missing.'
          assert 'movePointerId != -1000' in input_hub, 'The real-touch path must not overwrite movement supplied by the guarded GUI fallback.'
          assert 'Input.simulateMouseWithTouches = true;' in input_hub, 'Android IMGUI menu and pause controls must receive synthesized touch events.'
          assert 'guiFallbackOwnsPointer' in gui_fallback and 'Input.touchCount > 0' in gui_fallback, 'Android IMGUI fallback must defer to live finger IDs but recover if legacy touch entries are missing.'
          assert 'float fireHit = actionHitRadius * 1.02f;' in input_hub and 'float actionHitRadius = BaseActionHitRadius * scale * controlScale;' in input_hub and 'bool broadFireZone' in input_hub and '!insideOtherActionZone' in input_hub, 'Mobile action hit zones must use the tested radius independent from the movement stick and preserve firing priority.'
          assert 'Screen.width - 352f * scale' in input_hub and 'Screen.height - bottom - 236f * scale' in input_hub and 'Screen.height - bottom - 300f * scale' in input_hub, 'Mobile action-button hit-zones must be separated so fire cannot register as reload/grenade/melee.'
          assert 'private int guiMoveMouseButton = -1;' in input_hub and 'private int guiFireMouseButton = -1;' in input_hub, 'Fallback touchscreen contacts need independent movement and fire button ownership.'
          fallback_start = input_hub.index('private void HandleGuiPointerFallback()')
          fallback_end = input_hub.index('private void CreateGuiTextures()', fallback_start)
          fallback = input_hub[fallback_start:fallback_end]
          assert 'if (Application.isMobilePlatform)\n                return;' not in fallback, 'Android IMGUI fallback must not be unconditionally disabled.'
          assert 'private void HandleHeroSelectTouches()' in flow and 'HeroSelectionContinuedByTouch' in flow, 'Android hero selection must support direct touches.'
          assert 'startRect.Contains(screen)' in flow, 'Android Start Match must support direct touches.'
          assert 'guiMoveMouseButton == e.button' in gui_fallback and 'guiFireMouseButton == e.button' in gui_fallback, 'Drag events must only control the finger/button that originally claimed the input.'
          assert 'movePointerId == -1 &&' in gui_fallback and 'guiMoveMouseButton == -1' in gui_fallback, 'A second touch must not overwrite an already-held fallback movement pointer.'
          assert 'if (handled)' in gui_fallback and 'e.Use();' in gui_fallback, 'Only owned MouseUp events may be consumed; unrelated UI releases must pass through.'
          touch_start = input_hub.index('private void HandleAndroidTouches()')
          touch_end = input_hub.index('private Vector2 ApplyDeadZone(', touch_start)
          touch_handler = input_hub[touch_start:touch_end]
          assert 'movePointerId' in touch_handler and 'firePointerId' in touch_handler and 'TryGetTouch(movePointerId' in touch_handler and 'TryGetTouch(firePointerId' in touch_handler, 'Movement and fire must retain separate finger IDs.'
          assert 'DrawAimGuide(' not in input_hub and 'lineTexture' not in input_hub, 'Yellow target line is still drawn by mobile input HUD.'
          assert 'reloadHeldToSwap' in input_hub and 'player.Weapon?.CycleWeapon()' in input_hub, 'Mobile users have no weapon-change gesture.'
          assert 'HOLD SWAP' in input_hub, 'Reload-button hold-to-swap gesture is not labelled.'
          print('Combat/city regression checks: PASS (one/two storeys, warehouses, pitched roofs, screen-space enemy HP, no yellow aim line, weapon-specific range/speed, dynamic yellow range ring and weapon switching).')
          PY

          echo 'Unity project structure/settings validation passed.'

      - name: Validate requested enemy weapons, pickups, and city clearances
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('UnityProject/Assets/Scripts')
          enemy = (root / 'Enemy/EnemyChase.cs').read_text(encoding='utf-8')
          projectile = (root / 'Combat/EnemyProjectile.cs').read_text(encoding='utf-8')
          health = (root / 'Combat/TargetHealth.cs').read_text(encoding='utf-8')
          spawner = (root / 'World/EnemySpawner.cs').read_text(encoding='utf-8')
          pickup = (root / 'Combat/PickupItem.cs').read_text(encoding='utf-8')
          world = (root / 'Core/GameBootstrap.cs').read_text(encoding='utf-8')
          health_bar = (root / 'UI/EnemyHealthBar.cs').read_text(encoding='utf-8')
          flow = (root / 'Core/PrototypeFlow.cs').read_text(encoding='utf-8')

          assert 'WeaponController.GetEffectiveRangeForKind(DroppedWeaponKind)' in enemy, 'Enemy weapon range must match player range by weapon kind.'
          assert 'PlanLocalRoute(' in enemy and 'CanTravelDirectly(' in enemy, 'Enemy pursuit must route around blocking colliders.'
          assert 'PistolSlide' in enemy and 'MachineGunReceiver' in enemy and 'AKMagazine' in enemy, 'Enemy weapon silhouettes must be distinct.'
          assert 'shot.Configure(shotDirection, rangedDamage, transform, rangedRange);' in enemy, 'Enemy firing does not pass its effective range to the projectile.'
          assert 'Configure(Vector3 launchDirection, int damageAmount, Transform ownerTransform, float maxRange)' in projectile, 'Enemy projectile has no explicit distance cap.'
          assert 'lifetime = Mathf.Max(0.05f, Mathf.Max(1f, maxRange) / Mathf.Max(1f, speed));' in projectile, 'Enemy projectile lifetime is not tied to weapon range.'
          assert 'SpawnDroppedWeapon(enemy);' in health and 'pickup.ConfigureWeapon(enemy.DroppedWeaponKind, 24);' in health, 'Enemy death does not drop the matching weapon.'
          extraction = (root / 'Core/ExtractionBeacon.cs').read_text(encoding='utf-8')
          assert 'ExtractionBeacon.NotifyEnemyDefeated(enemy);' not in health, 'Enemy death must not create a permanent premature extraction controller.'
          assert 'ExtractionBeacon.ActivateForVictory(activePlayer)' in spawner, 'Final-wave clear must activate extraction instead of ending the match.'
          assert 'FindClearGroundNearPlayer(player)' in extraction and 'BlueExtractionBeamOuter' in extraction and 'BlueExtractionBeamCore' in extraction, 'Final-wave extraction beam is missing or has no nearby ground placement.'
          assert 'Resources.Load<Shader>("PersiaWarAndroidFade")' in extraction, 'Extraction beam must use the project-owned transparent Android shader.'
          assert 'GameSession.Instance.EndMission(true)' in extraction, 'Entering the extraction beam does not end the mission as a win.'
          assert 'ExtractionBeacon.IsActive' in flow and 'ExtractionBeacon.WorldPosition' in flow, 'Extraction objective is not visible on the active Android minimap/HUD.'
          assert 'GameSession.Instance?.EndMission(true)' not in spawner, 'Enemy spawner must not finish the mission before extraction.'
          assert 'Weapon' in pickup and 'player.Weapon.EquipWeaponFromPickup(weaponKind, amount);' in pickup, 'Dropped weapon cannot be picked up and equipped as the active weapon.'
          weapon_controller = (root / 'Combat/WeaponController.cs').read_text(encoding='utf-8')
          assert 'public void EquipWeaponFromPickup(WeaponKind selectedWeapon, int reserveAmmo)' in weapon_controller, 'Weapon pickup does not use the explicit equip path.'
          assert 'ApplyWeaponProfile(true);' in weapon_controller and 'projectileLifetime = weaponRange / Mathf.Max(1f, projectileSpeed);' in weapon_controller, 'Equipping a weapon does not refresh its projectile range/lifetime profile.'
          assert 'distance > EffectiveRange' in weapon_controller, 'Player firing can exceed the active weapon profile range.'
          assert 'LightPistolRange = 7.5f' in weapon_controller and 'AssaultRifleRange = 13.5f' in weapon_controller and 'HeavyMachineGunRange = 21f' in weapon_controller, 'Picked pistol/rifle/heavy weapons do not have distinct halved effective ranges.'
          assert 'new Color(0.52f, 0.54f, 0.57f)' in world, 'Road asphalt has not been lightened to gray.'
          assert 'AndroidContinuousGroundFoundation' in world, 'Continuous ground foundation is missing.'
          assert 'AddClearAndroidAlleySegments' in world and 'androidBuildingHalfExtents' in world, 'Alley strips are not clipped around building footprints.'
          assert 'new Vector3(-79f, 0f, 89f)' in world, 'Outer houses overlap the outermost street.'
          assert 'bool isPitchedRoof = !isWarehouse && (i % 3 != 0 || i == 0);' in world, 'Most houses should have pitched roofs.'
          assert 'cameraDistance > Mathf.Max(1f, maxVisibleDistance)' in health_bar and 'Physics.Raycast(' in health_bar, 'Enemy health bars must obey distance and occlusion.'
          flow = (root / 'Core/PrototypeFlow.cs').read_text(encoding='utf-8')
          assert not (root / 'UI/AndroidMinimapOverlay.cs').exists(), 'The duplicate minimap camera must stay removed; PrototypeFlow owns the active Android minimap.'
          assert 'float mapSize = Mathf.Clamp(148f * scale * 1.38f * 1.15f * 1.20f, 180f, 314f);' in flow, 'Active Android minimap size has regressed.'
          assert 'Fill(map, new Color(0.12f, 0.28f, 0.12f, 0.42f));' in flow, 'Active Android minimap transparency has regressed.'
          assert 'AndroidMinimapRoadCoordinates' in flow and 'AndroidMinimapBuildingPoints' in flow, 'Active Android minimap must follow the built city layout.'
          assert 'new Color(0.52f, 0.54f, 0.57f)' in world, 'Road asphalt has not been lightened to very light gray.'
          print('Minimap transparency/size/world-layer and bright-road regression checks: PASS')
          print('Requested gameplay/terrain regression checks: PASS')
          PY

      - name: Report Unity version
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^m_EditorVersion:' UnityProject/ProjectSettings/ProjectVersion.txt

      - name: Check for tracked build outputs
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(Library|Temp|Obj|Builds?)/' >/dev/null; then
            echo 'Tracked Unity build/cache output detected.'
            exit 1
          fi
          echo 'Repository hygiene validation passed.'

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          lfs: true

      - name: Validate Unity Personal credentials
        shell: bash
        env:
          UNITY_EMAIL_INPUT: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_INPUT: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${UNITY_EMAIL_INPUT}" ]] || { echo "::error::UNITY_EMAIL secret is missing."; exit 1; }
          [[ -n "${UNITY_PASSWORD_INPUT}" ]] || { echo "::error::UNITY_PASSWORD secret is missing."; exit 1; }
          echo "Unity Personal credentials are present. The build will use GameCI's current licensing client path."

      - name: Verify build source
        shell: bash
        run: |
          set -euo pipefail
          echo "Unity APK source commit: $(git rev-parse HEAD)"
          expected_ref="${{ inputs.build_ref || github.sha }}"
          expected_sha="$(git rev-parse "$expected_ref^{commit}")"
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected build source: $expected_sha"
          echo "Actual checkout: $actual_sha"
          test "$actual_sha" = "$expected_sha" || {
            echo "::error::Checkout SHA does not match the requested build source."
            exit 1
          }

      # Unity Library cache intentionally disabled for deterministic CI builds.
      # Restoring a stale/large Library can block before the actual Unity build.

      - name: Build Unity Android APK directly
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          IMAGE="unityci/editor:2022.3.62f1-android-3"

          # The shared runner may hit Docker Hub's anonymous pull limit.
          # Authenticate when repository-level Docker Hub secrets are configured.
          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "::warning::Docker Hub secrets are not configured; attempting the public image pull unauthenticated."
          fi

          mkdir -p .ci
          cleanup() {
            sudo chown -R "$(id -u):$(id -g)" .ci UnityProject/Assets/Editor UnityProject/Assets/Tests .ci-unity-home 2>/dev/null || true
            rm -f .ci/unity-build.sh
            rm -f UnityProject/Assets/Editor/PersiaWarCiBuild.cs UnityProject/Assets/Editor/PersiaWarCiBuild.cs.meta
            rm -f UnityProject/Assets/Tests/PersiaWarStartupSmokeTests.cs UnityProject/Assets/Tests/PersiaWarStartupSmokeTests.cs.meta
            rm -f UnityProject/Assets/Tests/PersiaWarStartupTests.asmdef UnityProject/Assets/Tests/PersiaWarStartupTests.asmdef.meta
            rmdir UnityProject/Assets/Tests 2>/dev/null || true
            rm -f UnityProject/Assets/Editor/PersiaWarCiSmoke.cs UnityProject/Assets/Editor/PersiaWarCiSmoke.cs.meta
            rmdir UnityProject/Assets/Editor 2>/dev/null || true
            rm -rf .ci-unity-home
          }
          trap cleanup EXIT

          mkdir -p UnityProject/Assets/Editor
          cat > UnityProject/Assets/Editor/PersiaWarCiBuild.cs <<'CS'
          using System;
          using System.IO;
          using UnityEditor;
          using UnityEditor.Build;
          using UnityEditor.Build.Reporting;
          using UnityEngine;
          using UnityEngine.Rendering;

          public static class PersiaWarCiBuild
          {
              public static void BuildAndroid()
              {
                  var projectRoot = Directory.GetParent(Application.dataPath).FullName;
                  var outputDirectory = Path.GetFullPath(Path.Combine(projectRoot, "..", "build", "Android"));
                  var output = Path.Combine(outputDirectory, "PersiaWar.apk");
                  Directory.CreateDirectory(outputDirectory);

                  const string bootScenePath = "Assets/Scenes/BootScene.unity";
                  const string gameplayScenePath = "Assets/Scenes/PersiaWarPrototype.unity";

                  if (!File.Exists(Path.Combine(Application.dataPath, "Scenes/BootScene.unity")))
                      throw new Exception("Required scene is missing: " + bootScenePath);
                  if (!File.Exists(Path.Combine(Application.dataPath, "Scenes/PersiaWarPrototype.unity")))
                      throw new Exception("Required scene is missing: " + gameplayScenePath);

                  PlayerSettings.SetScriptingBackend(
                      NamedBuildTarget.Android,
                      ScriptingImplementation.IL2CPP
                  );
                  PlayerSettings.Android.targetArchitectures = AndroidArchitecture.ARM64;

                  // Mobile compatibility hardening: explicitly avoid Vulkan on the target device class.
                  // OpenGLES3 is broadly supported on the project's Android minimum/target range and
                  // removes a common native startup failure path while leaving gameplay code unchanged.
                  PlayerSettings.SetGraphicsAPIs(
                      BuildTarget.Android,
                      new[] { GraphicsDeviceType.OpenGLES3 }
                  );
                  PlayerSettings.colorSpace = ColorSpace.Gamma;

                  var graphicsApis = PlayerSettings.GetGraphicsAPIs(BuildTarget.Android);
                  Console.WriteLine("UNITY_ANDROID_GRAPHICS_API:" + string.Join(",", graphicsApis));
                  if (graphicsApis.Length != 1 || graphicsApis[0] != GraphicsDeviceType.OpenGLES3)
                      throw new Exception("Android graphics API was not forced to OpenGLES3.");

                  var backend = PlayerSettings.GetScriptingBackend(NamedBuildTarget.Android);
                  var architecture = PlayerSettings.Android.targetArchitectures;
                  Console.WriteLine("UNITY_ANDROID_BACKEND:" + backend);
                  Console.WriteLine("UNITY_ANDROID_ARCH:" + architecture);

                  if (backend != ScriptingImplementation.IL2CPP)
                      throw new Exception("Android scripting backend was not set to IL2CPP.");
                  if (architecture == AndroidArchitecture.None)
                      throw new Exception("Android target architecture is None.");

                  EditorBuildSettings.scenes = new[]
                  {
                      new EditorBuildSettingsScene(bootScenePath, true),
                      new EditorBuildSettingsScene(gameplayScenePath, true)
                  };

                  var options = new BuildPlayerOptions
                  {
                      scenes = new[] { bootScenePath, gameplayScenePath },
                      locationPathName = output,
                      target = BuildTarget.Android,
                      targetGroup = BuildTargetGroup.Android,
                      options = BuildOptions.None
                  };

                  var report = BuildPipeline.BuildPlayer(options);

                  if (report.summary.result != BuildResult.Succeeded)
                      throw new Exception("Unity Android build failed: " + report.summary.result);

                  Console.WriteLine("UNITY_BUILD_REPORT_ERRORS:" + report.summary.totalErrors);

                  if (!File.Exists(output) || new FileInfo(output).Length == 0)
                      throw new Exception("Unity reported success but APK file is missing or empty.");

                  File.WriteAllText(
                      Path.Combine(outputDirectory, "UNITY_BUILD_SUCCESS.txt"),
                      "BuildResult=Succeeded\n" +
                      "TotalErrors=" + report.summary.totalErrors + "\n" +
                      "APK=" + output + "\n"
                  );
                  Console.WriteLine("UNITY_BUILD_SUCCEEDED:" + output);
                  Console.WriteLine("UNITY_BUILD_SENTINEL:" + Path.Combine(outputDirectory, "UNITY_BUILD_SUCCESS.txt"));
              }
          }
          CS

          cat > .ci/unity-build.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          export UNITY_HUB_PATH="/usr/lib/unityhub/unityhub"

          echo "=== Installing Unity Hub ==="
          if [[ ! -x /usr/lib/unityhub/unityhub && ! -x /opt/unityhub/unityhub ]]; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates wget gnupg xvfb
            mkdir -p /usr/share/keyrings
            wget -qO - https://hub.unity3d.com/linux/keys/public | gpg --dearmor > /usr/share/keyrings/Unity_Technologies_ApS.gpg
            rm -f /etc/apt/sources.list.d/unityhub.list
            cat > /etc/apt/sources.list.d/unityhub.sources <<'EOF'
          Types: deb
          URIs: https://hub.unity3d.com/linux/repos/deb
          Suites: stable
          Components: main
          Signed-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg
          EOF
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends unityhub
          fi

          HUB_BIN=""
          for candidate in /usr/lib/unityhub/unityhub /opt/unityhub/unityhub; do
            if [[ -x "$candidate" ]]; then
              HUB_BIN="$candidate"
              break
            fi
          done
          [[ -n "$HUB_BIN" ]] || { echo "::error::Unity Hub binary not found."; exit 1; }
          echo "Unity Hub found: $HUB_BIN"

          echo "=== Locating Unity Licensing Client ==="
          LICENSE_CLIENT=""
          while IFS= read -r candidate; do
            if [[ -x "$candidate" ]]; then
              LICENSE_CLIENT="$candidate"
              break
            fi
          done < <(find /usr/lib/unityhub /opt/unityhub -type f -name 'Unity.Licensing.Client' -perm -111 2>/dev/null || true)

          [[ -n "$LICENSE_CLIENT" ]] || {
            echo "::error::Unity.Licensing.Client was not found inside Unity Hub.";
            echo "Unity Hub directory:";
            find /usr/lib/unityhub /opt/unityhub -maxdepth 3 -type f 2>/dev/null | head -n 120 || true
            exit 1
          }

          echo "Unity Licensing Client found."

          mkdir -p /root/.local/share/unity3d/Unity
          mkdir -p /root/.config/unity3d/Unity

          echo "=== Activating Unity Personal license directly ==="
          "$LICENSE_CLIENT" \
            --activate-ulf \
            --username "$UNITY_EMAIL" \
            --password "$UNITY_PASSWORD" \
            --include-personal

          echo "=== Verifying Unity Personal entitlement ==="
          ENTITLEMENTS="$("$LICENSE_CLIENT" --showEntitlements 2>&1 || true)"
          printf '%s\n' "$ENTITLEMENTS" | sed 's/[[:space:]]*$//'
          printf '%s\n' "$ENTITLEMENTS" | grep -q "Unity Personal" || {
            echo "::error::Unity Personal entitlement was not activated."
            "$LICENSE_CLIENT" --showContext 2>&1 || true
            exit 1
          }

          test -s /root/.local/share/unity3d/Unity/Unity_lic.ulf
          echo "Unity Personal license file is ready."

          echo "=== Cleaning previous Android build output ==="
          rm -rf /workspace/build/Android

          echo "=== Building the existing Unity project ==="
          cd /workspace
          set +e
          unity-editor \
            -batchmode \
            -nographics \
            -quit \
            -accept-apiupdate \
            -projectPath /workspace/UnityProject \
            -buildTarget Android \
            -executeMethod PersiaWarCiBuild.BuildAndroid \
            -logFile -
          unity_exit=$?
          set -e

          echo "UNITY_EDITOR_EXIT_CODE:$unity_exit"
          test -s /workspace/build/Android/UNITY_BUILD_SUCCESS.txt || {
            echo "::error::Unity did not produce the verified build-success sentinel."
            exit "$unity_exit"
          }
          test -s /workspace/build/Android/PersiaWar.apk
          echo "UNITY_APK_READY:/workspace/build/Android/PersiaWar.apk"
          if [[ "$unity_exit" -ne 0 ]]; then
            echo "::warning::Unity Editor returned exit code $unity_exit after a successful BuildPipeline result; nonfatal editor diagnostics were present."
          fi

          SH
          chmod +x .ci/unity-build.sh

          rm -rf .ci-unity-home
          mkdir -p .ci-unity-home/.local/share/unity3d/Unity
          mkdir -p .ci-unity-home/.config/unity3d/Unity
          mkdir -p .ci-unity-home/.cache/unity3d

          docker run --rm \
            -e UNITY_EMAIL="$UNITY_EMAIL" \
            -e UNITY_PASSWORD="$UNITY_PASSWORD" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/.ci-unity-home:/root" \
            -w /workspace \
            "$IMAGE" \
            bash /workspace/.ci/unity-build.sh

          test -s build/Android/PersiaWar.apk
          sudo chown -R "$(id -u):$(id -g)" build/Android
          unzip -t build/Android/PersiaWar.apk >/dev/null
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path("build/Android/PersiaWar.apk")
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
          assert any(name.startswith("lib/arm64-v8a/") for name in names), "ARM64 ABI directory missing"
          assert "lib/arm64-v8a/libil2cpp.so" in names, "ARM64 libil2cpp.so missing"
          print("APK ZIP integrity: OK")
          print("ARM64 IL2CPP ABI: OK")
          PY
          echo "Verified Unity APK: build/Android/PersiaWar.apk (valid ZIP + ARM64 IL2CPP ABI + OpenGLES3)"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -d build/Android
          apk=$(find build/Android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          echo "Verified APK: $apk"

      - name: Write build provenance
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find build/Android -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          {
            echo "repository=karafarin12800-del/Persian"
            echo "branch=${{ github.ref_name }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "apk=$apk"
            echo "apk_sha256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
          } > build/Android/BUILD_PROVENANCE.txt

      - name: Upload Unity APK
        uses: actions/upload-artifact@v4
        with:
          name: PersiaWar-Unity-Android-${{ github.sha }}
          path: |
            build/Android/*.apk
            build/Android/BUILD_PROVENANCE.txt
          if-no-files-found: error

