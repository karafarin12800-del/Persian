name: Unity Cloud Activation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  activation:
    name: Generate Unity activation file
    runs-on: ubuntu-latest
    steps:
      - name: Generate activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: '2022.3.62f1'

      - name: Validate activation file
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ steps.activation.outputs.filePath }}"
          test -s "${{ steps.activation.outputs.filePath }}"
          echo "Activation file generated successfully."

      - name: Upload activation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-2022.3.62f1
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
