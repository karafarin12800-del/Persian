name: Acquire Unity activation file

on:
  workflow_dispatch: {}
  push:
    branches:
      - unity-2.5d
    paths:
      - '.github/workflows/activation.yml'

jobs:
  activation:
    name: Generate Unity 2022.3.62f1 activation file
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate .alf with the exact Unity editor version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p activation
          docker run --rm             -v "${GITHUB_WORKSPACE}/activation:/work"             -w /work             unityci/editor:ubuntu-2022.3.62f1-base-3             /opt/unity/Editor/Unity               -batchmode               -nographics               -quit               -createManualActivationFile               -logFile /dev/stdout
          alf=$(find activation -maxdepth 1 -type f -name '*.alf' -print -quit)
          test -n "${alf}"
          test -s "${alf}"
          echo "Generated activation file: ${alf}"
          if [ "${alf}" != "activation/Unity_v2022.3.62f1.alf" ]; then
            cp "${alf}" activation/Unity_v2022.3.62f1.alf
          fi
          test -s activation/Unity_v2022.3.62f1.alf

      - name: Upload .alf artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-v2022.3.62f1-activation
          path: activation/Unity_v2022.3.62f1.alf
          if-no-files-found: error
