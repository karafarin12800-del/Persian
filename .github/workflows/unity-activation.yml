name: Unity License Activation File

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unity-activation.yml'

jobs:
  activation:
    name: Request Unity activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: '2022.3.62f1'

      - name: Verify activation file
        shell: bash
        run: |
          set -euo pipefail
          file="${{ steps.getManualLicenseFile.outputs.filePath }}"
          test -f "$file"
          test -s "$file"
          echo "Activation file generated: $file"

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-2022.3.62f1
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          if-no-files-found: error
